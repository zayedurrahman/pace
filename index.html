<style>

body{margin:0;min-height:100vh;font:14px/1.55 Manrope,Inter,system-ui,"Noto Sans Bengali",sans-serif;color:var(--tx);background:radial-gradient(60% 45% at 12% -8%,rgba(99,102,241,.3),transparent),radial-gradient(40% 35% at 100% 0,rgba(34,211,238,.15),transparent),radial-gradient(35% 30% at 70% 100%,rgba(52,211,153,.1),transparent),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}

.hero:before{content:"";position:absolute;width:340px;height:340px;right:-90px;top:-150px;background:radial-gradient(circle,rgba(99,102,241,.35),transparent 65%);pointer-events:none}
