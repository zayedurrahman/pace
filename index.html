.pace-chart small{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}.pace-filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pace-log{display:grid;gap:8px}.pace-log-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.pace-log-row small{display:block;color:var(--mu);font-variant-numeric:tabular-nums}.pace-log-row p{margin:4px 0 0}.pace-empty{text-align:center;padding:28px 8px;color:var(--mu)}.pace-reminder{padding:10px 12px;border-radius:10px;background:rgba(251,191,36,.12);color:var(--warn)}#pace-toast{position:fixed;z-index:130;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 24px);padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:var(--sh);font-size:15px}#pace-toast:empty{display:none}#pace-toast button{border:0;background:none;color:var(--cy);font-weight:700;margin-left:8px}.pace-overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55)}.pace-dialog{width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;display:grid;gap:12px}.pace-dialog h2,.pace-dialog p{margin:0}.pace-dialog .row{justify-content:flex-end}.pace-log-row .btn{min-height:44px}kbd{padding:2px 6px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:.85em}

  nav.pace-open{transform:translateX(0)}nav button{flex:0 0 auto;width:100%;font-size:16px!important;padding:9px 12px!important;justify-content:flex-start!important;min-height:48px!important}nav .logo{display:flex;font-size:18px;padding-bottom:16px}nav .sp{display:block;flex:1;min-height:10px}nav .th{display:flex}main{padding:72px 16px 40px}.hero{grid-template-columns:1fr;gap:16px;padding:20px}.g2,.pace-two{grid-template-columns:1fr}.pace-metrics{grid-template-columns:1fr}.pace-metric{margin:6px 0}.pace-log-row{align-items:flex-start}.pace-head{align-items:flex-start}.pace-head>.btn{flex:none}

/* Semantic surface tokens shared by the dashboard, planner, matrix and reader. */

body{color:var(--text,var(--tx));background-color:var(--bg);background-image:radial-gradient(60% 42% at 8% 0,color-mix(in srgb,var(--accent) 11%,transparent),transparent 75%),radial-gradient(42% 34% at 100% 12%,color-mix(in srgb,var(--cy) 8%,transparent),transparent 78%),linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,var(--surface-raised)),var(--bg));background-attachment:fixed}

.pace-dashboard-hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(380px,.92fr);gap:15px;align-items:stretch}
.pace-dashboard-next{position:relative;isolation:isolate;display:flex;min-width:0;flex-direction:column;justify-content:space-between;overflow:hidden;padding:clamp(23px,3vw,34px);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--border));border-radius:23px;background:radial-gradient(65% 120% at 100% 0,color-mix(in srgb,var(--dash-gold) 11%,transparent),transparent 72%),radial-gradient(55% 90% at 100% 100%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 78%),linear-gradient(145deg,color-mix(in srgb,var(--surface-raised) 88%,var(--bg)),color-mix(in srgb,var(--bg) 80%,var(--surface-raised)));box-shadow:0 25px 72px -52px #000,inset 0 1px 0 color-mix(in srgb,var(--text) 9%,transparent)}

/* Dashboard productivity, exam planner, revision, countdown, and reader finish. */
.pace-productivity-dashboard{display:grid;gap:14px;margin:0 0 18px;padding:clamp(16px,2.2vw,24px);border:1px solid color-mix(in srgb,var(--accent) 23%,var(--border));border-radius:22px;background:radial-gradient(62% 120% at 100% 0,color-mix(in srgb,var(--accent) 11%,transparent),transparent 77%),linear-gradient(145deg,color-mix(in srgb,var(--surface-raised) 94%,var(--bg)),color-mix(in srgb,var(--surface) 88%,var(--bg)));box-shadow:0 18px 55px -42px #000,inset 0 1px 0 color-mix(in srgb,var(--text) 7%,transparent)}
.pace-productivity-heading,.pace-productivity-chart-card>header{display:flex;align-items:center;justify-content:space-between;gap:14px}
.pace-productivity-heading>div:first-child>small,.pace-productivity-chart-card>header small{color:var(--accent);font-size:9px;font-weight:850;letter-spacing:.15em}
.pace-productivity-heading h2{margin:4px 0;font-size:clamp(20px,2.5vw,27px);letter-spacing:-.045em}
.pace-productivity-heading p,.pace-productivity-chart-card>header h3{margin:0;color:var(--text-muted);font-size:11px}
.pace-productivity-score{display:grid;justify-items:end;gap:1px;flex:none}
.pace-productivity-score b{font-size:clamp(27px,4vw,40px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.06em;color:var(--accent)}
.pace-productivity-score span{color:var(--text-muted);font-size:9px}
.pace-productivity-chart-card{min-width:0;padding:15px 17px 10px;border:1px solid var(--border);border-radius:17px;background:color-mix(in srgb,var(--surface) 76%,transparent)}
.pace-productivity-chart-card>header{margin-bottom:5px}
.pace-productivity-chart-card>header>div{display:grid;gap:3px}
.pace-productivity-chart-card>header h3{color:var(--text);font-size:14px;font-weight:750}
.pace-productivity-chart-card>header>b{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.pace-productivity-chart-card>header>b small{color:var(--text-muted);font-size:9px;font-weight:600;letter-spacing:0}
.pace-productivity-chart-wrap{min-width:0}
.pace-productivity-chart{display:block;width:100%;height:clamp(145px,21vw,205px);overflow:visible}
.pace-productivity-gridlines line{stroke:color-mix(in srgb,var(--border) 73%,transparent);stroke-width:1;stroke-dasharray:3 7}
.pace-productivity-area{fill:url(#paceProductivityFill)}
.pace-productivity-line{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 7px color-mix(in srgb,var(--accent) 25%,transparent))}
.pace-productivity-point{fill:var(--surface-raised);stroke:var(--accent);stroke-width:3;transition:r .18s}
.pace-productivity-point:hover{r:6}
.pace-productivity-axis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:0 2px;color:var(--text-muted);font-size:9px;text-align:center}
.pace-productivity-axis span:last-child{color:var(--text);font-weight:750}
.pace-productivity-chart-card>footer{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:9px;border-top:1px solid var(--border);color:var(--text-muted);font-size:9px}
.pace-productivity-chart-card>footer span:first-child{display:flex;align-items:center;gap:6px}
.pace-productivity-chart-card>footer i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 45%,transparent)}
.pace-productivity-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pace-productivity-stats>article{display:flex;min-width:0;min-height:100px;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:12px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--surface-raised) 74%,transparent)}

.pace-productivity-insights>article>div{min-width:0}
.pace-productivity-insights b{font-size:10px}

.pace-productivity-report{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--text-muted);font-size:9px}

.pace-dashboard-plan-chart{display:grid;place-items:center;flex:none;width:118px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--accent) var(--pace-plan-progress),color-mix(in srgb,var(--border) 65%,transparent) 0);position:relative}

.pace-dashboard-plan-chart>div{position:relative;display:grid;justify-items:center;gap:2px}

.pace-exam-planner{padding:clamp(15px,2.2vw,24px);border-color:color-mix(in srgb,var(--accent) 22%,var(--border));border-radius:21px;background:radial-gradient(55% 110% at 100% 0,color-mix(in srgb,var(--accent) 8%,transparent),transparent 76%),linear-gradient(145deg,color-mix(in srgb,var(--surface) 96%,var(--bg)),color-mix(in srgb,var(--surface-raised) 74%,var(--bg)))}

.pace-chapter-plan>label.pace-chapter-select span b{font-size:10px;line-height:1.45}
.pace-chapter-plan>label.pace-chapter-select span small{color:var(--text-muted);font-size:8px;font-variant-numeric:tabular-nums}

.pace-chapter-progress>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--cy))}
.pace-chapter-plan>label:not(.pace-chapter-select){gap:5px;color:var(--text-muted);font-size:8px;font-weight:800}
.pace-chapter-plan>label:not(.pace-chapter-select) input{min-height:35px;border-color:var(--border);border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,var(--bg));font-size:10px;font-variant-numeric:tabular-nums}

.pace-review-page{gap:13px}
.pace-review-header{align-items:center;padding:4px 2px 3px}

.pace-review-header p{font-size:11px;line-height:1.55}
.pace-review-summary{gap:8px}
.pace-review-summary article{position:relative;min-height:84px;padding:13px 14px;border-radius:15px;background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 96%,var(--accent)),color-mix(in srgb,var(--surface-raised) 78%,var(--bg)))}
.pace-review-summary small,.pace-review-summary span{font-size:9px}
.pace-review-summary b{font-size:22px;font-variant-numeric:tabular-nums}
.pace-review-mastery-track{height:4px;margin-top:4px;overflow:hidden;border-radius:8px;background:color-mix(in srgb,var(--border) 80%,transparent)}
.pace-review-mastery-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--mint))}

  document.addEventListener('click',e=>{

document.addEventListener('click',async e=>{const b=e.target.closest('[data-st]');if(!b)return;const a=b.dataset.st,D=b.dataset;

 if(a=='lopen')return openFile(D.id);if(a=='lback'){document.body.classList.remove('pace-reading-active');L.id=null;L.pdf=null;if(L.url)URL.revokeObjectURL(L.url);L.url=null;render();return}if(a=='lfull'){const reader=$('#pace-reader');if(document.fullscreenElement)document.exitFullscreen?.();else{const req=reader?.requestFullscreen?.();req?.catch(()=>reader?.classList.toggle('reader-immersive'))}return}if(a=='ldel'){if(confirm('Delete this file and its highlights?')){await del(D.id);fillList()}return}

(a=='hlsel'){addSel();return}
const h=(L.rec?.hl||[]).find(x=>x.id==D.id);
if(a=='hj'&&h){go(h.pg);return}if(a=='hd'&&h){L.rec.hl=L.rec.hl.filter(x=>x!==h);await put(L.rec);paint();hlList();return}if(a=='hn'&&h){const n=prompt('Note for this highlight',h.n||'');if(n!==null){h.n=n;await put(L.rec);hlList()}return}if(a=='he'&&h){const t=prompt('Correct the selected text',h.t||'');if(t!==null){h.t=t.slice(0,400);await put(L.rec);hlList()}return}

if(a=='hv'&&h){try{const key='pace.hub.v1',data=JSON.parse(localStorage.getItem(key)||'{"version":1,"notes":[],"cards":[]}');data.notes=Array.isArray(data.notes)?data.notes:[];data.notes.unshift({id:'pdf-'+Date.now(),title:`${L.rec.name} · page ${h.pg}`,subject:L.rec.kind||'PDF',body:h.t+(h.n?'\n\nNote: '+h.n:''),link:''});localStorage.setItem(key,JSON.stringify(data));alert('Saved to Vault.')}catch(_){alert('Could not save this highlight to Vault. Free some browser storage and try again.')}return}
if(a=='hc'){navigator.clipboard?.writeText((L.rec.hl||[]).sort((x,y)=>x.pg-y.pg).map(x=>`p.${x.pg}: ${x.t}${x.n?' ('+x.n+')':''}`).join('\n'));return}
S.cp=S.cp||{};S.cn=S.cn||{};S.cdn=S.cdn||{};
if(a=='csave'){const v=+$('#cn-'+D.s).value;if(v<1||v>60){alert('Enter 1 to 60 classes.');return}S.cn[D.c]=v}else if(a=='cset'){const v=+prompt('Classes in this chapter',S.cn[D.c]||8);if(v>=1&&v<=60)S.cn[D.c]=v;else return}
else if(a=='cdone'){const cp=S.cp[D.s],c=Object.keys(CH).filter(x=>x.startsWith(D.s+'.'))[cp.i],N=S.cn[c]||1;S.cdn[dk()+'|'+D.s]=1;S.act[dk()]=1;cp.n++;if(cp.n>=N){S.ck[c]=(S.ck[c]|0)|1;cp.i++;cp.n=0}}else return;save();render()});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='lfile'){const status=$('#lib-status'),files=[...t.files];if(status)status.textContent=`Saving ${files.length} PDF${files.length===1?'':'s'} to this browser…`;let saved=0;try{for(const f of files){if(f.type&&f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')){alert(`${f.name} is not a PDF.`);continue}await put({id:'f'+Date.now()+Math.random().toString(36).slice(2,6),name:f.name,kind:$('#lkind').value,size:f.size,blob:f,added:Date.now(),page:1,hl:[]});saved++}t.value='';await fillList();if(status)status.textContent=saved?`${saved} PDF${saved===1?'':'s'} saved on this device.`:'PDFs are saved in this browser.'}catch(e){if(status)status.textContent='Could not save every file.';alert('The browser could not store this PDF. Browser storage is controlled by the device, so free some site storage or disk space and try again.')}}else if(t.id=='lpg')go(+t.value||1)});

let inkDraft=null;const inkPoint=(e,box)=>[Math.max(0,Math.min(1,(e.clientX-box.left)/box.width)),Math.max(0,Math.min(1,(e.clientY-box.top)/box.height))];document.addEventListener('pointerdown',e=>{const svg=e.target.closest('#pga');if(!svg||!['pen','marker','pencil','eraser'].includes(L.tool)||!L.rec)return;e.preventDefault();const box=svg.getBoundingClientRect(),point=inkPoint(e,box);if(L.tool==='eraser'){const strokes=(L.rec.strokes||[]).filter(x=>x.pg===L.pg);let best=null,dist=18;for(const s of strokes)for(const q of s.pts){const d=Math.hypot((q[0]-point[0])*box.width,(q[1]-point[1])*box.height);if(d<dist){best=s;dist=d}}if(best){L.rec.strokes=L.rec.strokes.filter(x=>x!==best);put(L.rec);paintInk()}return}inkDraft={id:'s'+Date.now()+Math.random().toString(36).slice(2,5),pointerId:e.pointerId,pg:L.pg,c:L.penColor,w:L.tool==='marker'?L.penWidth*3:L.tool==='pencil'?Math.max(1,L.penWidth*.55):L.penWidth,o:L.tool==='marker'?.32:1,pts:[point]};svg.setPointerCapture?.(e.pointerId)});document.addEventListener('pointermove',e=>{if(!inkDraft||e.pointerId!==inkDraft.pointerId)return;const svg=$('#pga'),box=svg?.getBoundingClientRect();if(!box)return;const events=e.getCoalescedEvents?.()||[e];for(const p of events){const point=inkPoint(p,box),last=inkDraft.pts.at(-1);if(Math.hypot((point[0]-last[0])*box.width,(point[1]-last[1])*box.height)>.6)inkDraft.pts.push(point)}let line=svg.querySelector('[data-draft]');if(!line){line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.dataset.draft='';line.setAttribute('fill','none');line.setAttribute('stroke',inkDraft.c);line.setAttribute('stroke-width',inkDraft.w);line.setAttribute('stroke-opacity',inkDraft.o);line.setAttribute('stroke-linecap','round');line.setAttribute('stroke-linejoin','round');svg.append(line)}line.setAttribute('points',inkDraft.pts.map(p=>`${p[0]*box.width},${p[1]*box.height}`).join(' '))});const finishInk=async e=>{if(!inkDraft||e.pointerId!==inkDraft.pointerId)return;const s=inkDraft;inkDraft=null;if(s.pts.length<2){paintInk();return}(L.rec.strokes=L.rec.strokes||[]).push(s);L.undo.push({type:'stroke',id:s.id});await put(L.rec);paintInk()};document.addEventListener('pointerup',finishInk);document.addEventListener('pointercancel',finishInk);
